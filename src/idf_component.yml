## espressif/led_strip powers the status-LED feature (include/app.h) on
## every board. The two P4-only entries below are the Atlas-P4-3CAN
## port: ESP32-P4 has no on-chip WiFi radio, and the Waveshare P4 WiFi6
## board carries an ESP32-C6 companion chip on SDIO (CLK=18 CMD=19
## D0..D3=14..17, RESET=54). esp_wifi_remote 1.6.4 mirrors the pioarduino
## 3.3.12 esp32p4 stack and provides the esp_wifi.h-compatible API the
## runtime shim already speaks. esp_hosted bumped 2.12.13 -> 2.13.1
## (2026-11-03, field-crash round 5 + DHCP half-sync follow-up): 2.13.1
## stops the RPC threads before esp_hosted_deinit() frees what they wait
## on — upstream words it as "removes a heap corruption on every deinit"
## — which our boot retry and the dashboard's hosted hot reset now
## exercise; it also pre-allocates SDIO-streaming Rx buffers and skips
## malformed init-event TLVs instead of abandoning the event. The C6
## co-processor firmware stays at its shipped 2.12.x build (host honors
## legacy 1600-byte transports). The target rules keep every other
## (xtensa) env untouched: no fetch, no build, golden parity intact.
dependencies:
  espressif/led_strip: "^3.0.1"
  espressif/esp_hosted:
    version: "2.13.1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "1.6.4"
    rules:
      - if: "target == esp32p4"
